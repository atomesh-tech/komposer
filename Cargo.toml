[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0-rc.1"
license = "MIT"
repository = "https://github.com/atomesh-tech/komposer"
homepage = "https://github.com/atomesh-tech/komposer"

[package]
name = "komposer"
description = "A Rust implementation of the Composer PHP dependency manager"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "komposer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
fancy-regex = "0.19.2"
indexmap = "2.14.2"
komposer-autoload = { path = "crates/autoload" }
komposer-installer = { path = "crates/installer" }
komposer-package = { path = "crates/package" }
komposer-repository = { path = "crates/repository" }
komposer-semver = { path = "crates/semver" }
komposer-solver = { path = "crates/solver" }
md-5 = "0.11.0"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
