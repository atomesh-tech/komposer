[package]
name = "komposer-repository"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
flate2 = "1.1.10"
glob = "0.3.4"
komposer-package = { path = "../package" }
komposer-semver = { path = "../semver" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "fs", "io-util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
